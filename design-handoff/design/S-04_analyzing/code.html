"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},spacing:{"margin-mobile":"1.25rem","space-lg":"1.5rem","gutter-mobile":"1rem","gutter":"1.5rem","space-sm":"0.5rem","margin":"3rem","space-md":"0.875rem","space-xl":"2.5rem","space-xs":"0.25rem"},fontFamily:{"body-md":["Work Sans"],"mono-meta":["JetBrains Mono"],"headline-md":["Work Sans"],"body-sm":["Work Sans"],"body-lg":["Work Sans"],"headline-lg":["Work Sans"],"display-mobile":["Work Sans"],"mono-index":["JetBrains Mono"],"headline-sm":["Work Sans"],"editorial-badge":["Work Sans"],"display":["Work Sans"]},fontSize:{"body-md":["15px",{lineHeight:"24px",letterSpacing:"-0.005em",fontWeight:"400"}],"mono-meta":["11px",{lineHeight:"16px",letterSpacing:"0.04em",fontWeight:"400"}],"headline-md":["20px",{lineHeight:"28px",letterSpacing:"-0.01em",fontWeight:"500"}],"body-sm":["13px",{lineHeight:"20px",letterSpacing:"0em",fontWeight:"400"}],"body-lg":["17px",{lineHeight:"28px",letterSpacing:"-0.005em",fontWeight:"400"}],"headline-lg":["24px",{lineHeight:"32px",letterSpacing:"-0.015em",fontWeight:"600"}],"display-mobile":["26px",{lineHeight:"34px",letterSpacing:"-0.02em",fontWeight:"600"}],"mono-index":["13px",{lineHeight:"18px",letterSpacing:"0.02em",fontWeight:"500"}],"headline-sm":["17px",{lineHeight:"24px",letterSpacing:"-0.01em",fontWeight:"500"}],"editorial-badge":["12px",{lineHeight:"16px",letterSpacing:"0.01em",fontWeight:"500"}],"display":["32px",{lineHeight:"40px",letterSpacing:"-0.02em",fontWeight:"600"}]}}}};</script></head><body class="bg-background font-body-md text-on-surface min-h-screen flex flex-col selection:bg-tertiary-fixed selection:text-on-tertiary-fixed"><header class="fixed top-0 left-0 w-full z-50 bg-surface/90 backdrop-blur-md shadow-[0_1px_8px_rgba(0,0,0,0.02)]"><div class="h-14 max-w-7xl mx-auto px-margin-mobile lg:px-margin flex items-center justify-between"><a class="flex items-center text-primary no-underline" data-path="verification" href="#"><span class="font-headline-sm text-headline-sm text-primary tracking-tight font-semibold">일단확인</span></a></div></header><main class="flex-1 w-full pt-14 bg-background"><div class="flex flex-col w-full">
<div class="w-full min-h-[calc(100vh-7.5rem)] flex flex-col justify-center items-center px-margin-mobile lg:px-margin py-space-xl">
<div class="w-full max-w-xl mx-auto flex flex-col items-center text-center">
<!-- Section Sub-tag / Archival Gutter Mark -->
<div class="inline-flex items-center gap-space-xs mb-space-sm px-space-sm py-[3px] bg-surface-container rounded">
<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
<span class="font-mono-meta text-mono-meta text-on-surface-variant tracking-wider">§ 04 · 확인 진행 중</span>
</div>
<!-- Main Editorial Headline -->
<h1 class="font-display text-display text-primary tracking-tight font-semibold mb-space-xs [word-break:keep-all]">
        문서의 근로조건을 확인하고 있어요.
      </h1>
<!-- Secondary Objective Description -->
<p class="font-body-md text-body-md text-on-surface-variant max-w-md mx-auto mb-space-xl [word-break:keep-all]">
        문서에 적힌 내용을 점검 기준에 따라 정리하고 있어요. 잠시만 기다려 주세요.
      </p>
<!-- Centerpiece: Editorial Proof Sheet Simulation Card -->
<div class="w-full max-w-[460px] relative bg-surface-container-lowest shadow-[0_4px_24px_rgba(27,28,23,0.04)] rounded-lg overflow-hidden text-left mb-space-xl">
<!-- Sheet Header Bar -->
<div class="bg-surface-container-low px-space-lg py-3 flex items-center border-b border-surface-container-high/60"><div class="w-12 h-1.5 rounded-full bg-surface-dim/60"></div></div>
<!-- Sheet Interior (Paper Desk Plane) -->
<div class="p-space-lg lg:p-space-xl relative"><div class="absolute left-6 top-0 bottom-0 w-[1.5px] bg-secondary/30 pointer-events-none"></div><div class="pl-space-lg space-y-4 relative py-1"><div class="space-y-1.5 pb-1"><div class="h-2.5 bg-surface-container-highest rounded-sm w-[38%]"></div><div class="h-1.5 bg-surface-container rounded-sm w-[24%]"></div></div><div class="space-y-2 py-1"><div class="relative inline-block w-full overflow-hidden rounded-sm"><div class="h-2.5 bg-surface-container-high rounded-sm w-[90%]"></div><div class="absolute top-0 left-0 h-2.5 bg-tertiary-fixed rounded-sm pointer-events-none" style="mix-blend-mode: multiply; opacity: 0.85; animation: proofSweep 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div></div><div class="h-2 bg-surface-container rounded-sm w-[76%]"></div><div class="h-2 bg-surface-container rounded-sm w-[58%]"></div></div><div class="space-y-2 py-1.5"><div class="relative inline-block w-full overflow-hidden rounded-sm"><div class="h-2.5 bg-surface-container-high rounded-sm w-[84%]"></div><div class="absolute top-0 left-0 h-2.5 bg-tertiary-fixed rounded-sm pointer-events-none" style="mix-blend-mode: multiply; opacity: 0.85; animation: proofSweep 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.6s;"></div></div><div class="h-2 bg-surface-container rounded-sm w-[68%]"></div><div class="h-2 bg-surface-container-low rounded-sm w-[44%]"></div></div><div class="pt-1 space-y-1.5"><div class="h-2 bg-surface-container rounded-sm w-[62%]"></div><div class="h-1.5 bg-surface-container-low rounded-sm w-[36%]"></div></div></div></div>
<!-- Bottom Ambient Activity Line (Indeterminate Progress, Zero Percentage) -->
<div class="w-full h-[3px] bg-surface-container/60 relative overflow-hidden"><div class="absolute top-0 bottom-0 bg-secondary/40 w-1/4 rounded-full" style="animation: ambientScan 3s cubic-bezier(0.45, 0, 0.25, 1) infinite;"></div></div>
</div>
<!-- Editorial Notice & Reassurance Footnote -->
<div class="flex flex-col items-center gap-space-xs text-center max-w-sm">
<div class="flex items-center gap-2">
<!-- Calm Ink Pulse Dot -->
<span class="w-1.5 h-1.5 rounded-full bg-primary" style="animation: editorialBreathe 2s ease-in-out infinite;"></span>
<span class="font-body-sm text-body-sm text-on-surface font-medium">
            분석이 완료되면 점검 결과가 표시됩니다.
          </span>
</div>
<p class="font-mono-meta text-mono-meta text-on-surface-variant [word-break:keep-all]">문서의 길이와 형식에 따라 시간이 걸릴 수 있어요.</p>
</div>
</div>
</div>
<!-- Keyframe Motion Styles for Indeterminate Proofreading Behavior -->
<svg aria-hidden="true" class="hidden">
<defs>
<style>
        @keyframes proofSweep {
          0% {
            width: 0%;
            left: 0%;
            opacity: 0.2;
          }
          30% {
            width: 78%;
            left: 0%;
            opacity: 0.9;
          }
          70% {
            width: 78%;
            left: 0%;
            opacity: 0.9;
          }
          100% {
            width: 78%;
            left: 100%;
            opacity: 0;
          }
        }

        @keyframes editorialBreathe {
          0%, 100% {
            opacity: 0.35;
            transform: scale(0.92);
          }
          50% {
            opacity: 1;
            transform: scale(1.08);
          }
        }

        @keyframes ambientScan {
          0% {
            left: -35%;
          }
          50% {
            left: 45%;
          }
          100% {
            left: 105%;
          }
        }

        @media (prefers-reduced-motion: reduce) {
          * {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
          }
        }
      </style>
</defs>
</svg>
</div></main><footer class="w-full bg-surface-container-low mt-auto"><div class="max-w-7xl mx-auto px-margin-mobile lg:px-margin py-space-md flex flex-col sm:flex-row items-center justify-between gap-space-xs"><p class="font-body-sm text-body-sm text-on-surface-variant text-center sm:text-left">문서에 적힌 내용을 확인하며 법률 위반 여부는 판단하지 않습니다. © 일단확인</p></div></footer>

</body></html>
