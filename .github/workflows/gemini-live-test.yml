# 실제 Gemini API(무료 등급) 연결 테스트 — 수동 실행 전용
# - 가상 문서 샘플을 분석한다 (기본: 전체, 입력값 samples로 일부만 선택, 샘플 사이 15초 대기). 실제 개인정보 문서는 쓰지 않는다.
# - GEMINI_API_KEY는 GitHub Actions Secrets에서만 읽고, 로그에 출력하지 않는다.
# - 모델은 앱 기본 모델과 같은 무료 등급 gemini-3.5-flash-lite로 고정한다. 유료 모델 자동 전환(fallback)은 없다.
name: Gemini live test

on:
  workflow_dispatch:
    inputs:
      samples:
        description: '분석할 샘플 키 (쉼표 구분, 비우면 전체). 예: S3_missing'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: gemini-live-test
  cancel-in-progress: false

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (no API calls)
        run: npm test

      - name: Check that the secret is registered
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not registered (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "GEMINI_API_KEY is registered."

      - name: Live Gemini test (fictional documents)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          AI_TIMEOUT_MS: '60000'
          SAMPLES: ${{ inputs.samples }}
        run: |
          if [ -n "$SAMPLES" ]; then
            npm run eval:live -- "--samples=$SAMPLES"
          else
            npm run eval:live
          fi

      # 보고서에는 상태·근거 번호·AI 응답 JSON만 있고 문서 원문과 키는 없다.
      - name: Print report
        if: always()
        run: cat docs/test-report-live.md || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-live-report
          path: docs/test-report-live.md
          if-no-files-found: warn
          retention-days: 14
