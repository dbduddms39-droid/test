# 웹앱 실제 사용자 흐름 확인 (브라우저 E2E) — 수동 실행 전용
# - base_url을 비우면: 러너 안에서 웹 서버를 띄워 검사한다.
#     1) 붙여넣기 흐름: 문서 유형 선택 → 붙여넣기 → 분석 → 8개 항목 → 원문 근거 → 질문 복사
#     2) 업로드 흐름: 가상 PDF·한국어 이미지·스캔 PDF → 브라우저 안 추출·OCR → 수정 → 분석, 오류 안내
# - base_url에 배포 주소(예: https://xxx.vercel.app)를 넣으면: 배포된 사이트를 대상으로 붙여넣기·질문 복사 흐름과 업로드 흐름을 검사한다.
# - GEMINI_API_KEY는 GitHub Actions Secrets에서 로컬 서버 프로세스 환경변수로만 전달한다 (배포 검사 때는 쓰지 않음).
# - 모델은 무료 등급 gemini-3.5-flash-lite. 유료 모델 자동 전환(fallback)은 없다.
name: Web E2E (browser)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: '배포 사이트 주소 (비우면 러너에서 로컬 서버로 검사). 예: https://xxx.vercel.app'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: web-e2e
  cancel-in-progress: false

jobs:
  browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Paste flow with real Gemini analysis (local server)
        if: inputs.base_url == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          AI_TIMEOUT_MS: '60000'
          E2E_REQUIRE_AI: 'true'
        run: node scripts/e2e-browser.mjs

      - name: Upload flow (PDF, Korean image, scanned PDF) with real Gemini analysis (local server)
        if: inputs.base_url == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          AI_TIMEOUT_MS: '60000'
          E2E_REQUIRE_AI: 'true'
          E2E_PORT: '3211'
        run: node scripts/e2e-upload.mjs

      - name: Paste flow and question copy against deployed site
        if: inputs.base_url != ''
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_REQUIRE_AI: 'true'
        run: node scripts/e2e-browser.mjs

      - name: Upload flow against deployed site
        if: inputs.base_url != ''
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_REQUIRE_AI: 'true'
        run: node scripts/e2e-upload.mjs

      - name: OCR accuracy benchmark (fictional images, browser only, no API calls)
        if: always()
        env:
          OCR_BENCH_BASE: ${{ inputs.base_url }}
        run: |
          if [ -z "$OCR_BENCH_BASE" ]; then unset OCR_BENCH_BASE; fi
          node scripts/ocr-bench.mjs --json=e2e-artifacts/ocr-bench.json

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-screenshots
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14
